<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Arial, sans-serif" role="img" aria-label="IT Governance &amp; Microsoft 365 Business Premium">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2236"/>
      <stop offset="58%" stop-color="#132e4a"/>
      <stop offset="100%" stop-color="#0b4f8a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#50e6ff"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#153250"/>
      <stop offset="100%" stop-color="#0b1b2b"/>
    </linearGradient>
    <pattern id="gridDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#50e6ff" opacity="0.14"/>
    </pattern>
  </defs>

  <!-- Base container -->
  <rect width="1000" height="260" rx="16" fill="url(#bgGrad)"/>
  <rect x="520" y="0" width="480" height="260" rx="16" fill="url(#gridDots)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1000" height="5" rx="2.5" fill="url(#accentGrad)"/>

  <!-- Decorative subtle architecture nodes on right -->
  <g stroke="#50e6ff" stroke-opacity="0.16" fill="none" stroke-width="1.5">
    <circle cx="910" cy="86" r="64"/>
    <circle cx="910" cy="86" r="102" stroke-dasharray="5 6"/>
    <path d="M760 228 Q845 186 930 218 T1000 205" stroke="#0078D4" stroke-opacity="0.35" stroke-width="2.5"/>
    <path d="M710 246 Q815 204 920 236 T1000 226" stroke="#50e6ff" stroke-opacity="0.22" stroke-width="2"/>
  </g>

  <!-- Left Emblem: Shield + Cloud 4-Tile Governance Icon -->
  <g transform="translate(46, 68)">
    <rect width="98" height="98" rx="20" fill="url(#cardGrad)" stroke="#0078D4" stroke-opacity="0.65" stroke-width="1.5"/>
    <!-- Shield outline -->
    <path d="M49 17 L76 28 V49 C76 66 64 78 49 84 C34 78 22 66 22 49 V28 Z" fill="#0f2236" stroke="#50e6ff" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- 4-tile M365 style core within shield -->
    <rect x="37" y="36" width="10" height="10" rx="2" fill="#0078D4"/>
    <rect x="51" y="36" width="10" height="10" rx="2" fill="#50e6ff"/>
    <rect x="37" y="50" width="10" height="10" rx="2" fill="#2b88d8"/>
    <rect x="51" y="50" width="10" height="10" rx="2" fill="#0078D4"/>
  </g>

  <!-- Top eyebrow label -->
  <text x="168" y="54" fill="#50e6ff" font-size="11.5" font-weight="700" letter-spacing="2.4">BLUEPRINT CORPORATIVO &amp; CASO DE ESTUDIO · PYME HÍBRIDA</text>

  <!-- Main Title -->
  <text x="168" y="100" fill="#ffffff" font-size="31" font-weight="800" letter-spacing="-0.3">IT Governance &amp; Microsoft 365 Business Premium</text>

  <!-- Subtitle -->
  <text x="168" y="133" fill="#b8d8f8" font-size="14.5" font-weight="500">Modern Workplace · Entra ID · Intune MDM · Seguridad Híbrida · Framework Documental ISO-Style</text>

  <!-- Divider line -->
  <line x1="168" y1="152" x2="946" y2="152" stroke="#50e6ff" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Capability Chips -->
  <g font-size="12" font-weight="600" transform="translate(0, 8)">
    <rect x="168" y="164" width="106" height="28" rx="14" fill="#0078D4" fill-opacity="0.28" stroke="#50e6ff" stroke-opacity="0.4" stroke-width="1"/>
    <text x="221" y="182" fill="#eef7ff" text-anchor="middle">Entra ID + MFA</text>

    <rect x="282" y="164" width="124" height="28" rx="14" fill="#0078D4" fill-opacity="0.28" stroke="#50e6ff" stroke-opacity="0.4" stroke-width="1"/>
    <text x="344" y="182" fill="#eef7ff" text-anchor="middle">Intune + BitLocker</text>

    <rect x="414" y="164" width="118" height="28" rx="14" fill="#0078D4" fill-opacity="0.28" stroke="#50e6ff" stroke-opacity="0.4" stroke-width="1"/>
    <text x="473" y="182" fill="#eef7ff" text-anchor="middle">Exchange Online</text>

    <rect x="540" y="164" width="142" height="28" rx="14" fill="#0078D4" fill-opacity="0.28" stroke="#50e6ff" stroke-opacity="0.4" stroke-width="1"/>
    <text x="611" y="182" fill="#eef7ff" text-anchor="middle">SharePoint &amp; OneDrive</text>

    <rect x="690" y="164" width="116" height="28" rx="14" fill="#0078D4" fill-opacity="0.28" stroke="#50e6ff" stroke-opacity="0.4" stroke-width="1"/>
    <text x="748" y="182" fill="#eef7ff" text-anchor="middle">Defender Suite</text>

    <rect x="814" y="164" width="132" height="28" rx="14" fill="#0f2236" fill-opacity="0.7" stroke="#50e6ff" stroke-opacity="0.55" stroke-width="1"/>
    <text x="880" y="182" fill="#50e6ff" text-anchor="middle">10 Plantillas ISO</text>
  </g>

  <!-- Footer Signature -->
  <text x="168" y="230" fill="#7fa8cf" font-size="12">Caso sanitizado: Atlantic Maritime Agency (AMA) · atlantic-agency.example.com</text>
  <text x="946" y="230" fill="#9ecbf0" font-size="12" font-weight="600" text-anchor="end">@toomastorres</text>
</svg>
